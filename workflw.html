<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bibi's Treats — Admin Portal Workflow (React Flow)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://esm.sh/@xyflow/react@12.6.0/dist/style.css" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0f172a;
    }
    * { box-sizing: border-box; }
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Inter', 'Noto Sans Thai', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .topbar {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }
    .topbar-card {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 16px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #0284c7;
      flex-shrink: 0;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 12px;
      color: var(--muted);
    }
    .pill-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pill {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill:hover { border-color: #cbd5e1; color: var(--text); }
    .pill.active {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }
    .wf-node {
      width: 242px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    }
    .wf-node.selected {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.14), 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .wf-node.dimmed { opacity: 0.28; }
    .wf-node-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .wf-tag {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .tag-admin { background: #eff6ff; color: #1d4ed8; }
    .tag-api { background: #f0fdf4; color: #15803d; }
    .tag-data { background: #fffbeb; color: #b45309; }
    .tag-auth { background: #f3e8ff; color: #7e22ce; }
    .wf-node-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 4px;
      line-height: 1.3;
    }
    .wf-node-desc {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.45;
      margin: 0;
    }
    .wf-node-file {
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px dashed #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .inspector {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 320px;
      max-width: calc(100vw - 32px);
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.09);
    }
    .inspector h4 { margin: 6px 0 4px; font-size: 15px; }
    .inspector p { margin: 0 0 10px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
    .inspector code {
      display: block;
      background: #f1f5f9;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11px;
      color: #0f172a;
      word-break: break-all;
    }
    .inspector-close {
      float: right;
      border: none;
      background: #f1f5f9;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      cursor: pointer;
      color: var(--muted);
    }
    .react-flow__handle {
      width: 8px;
      height: 8px;
      background: #94a3b8;
      border: 2px solid #fff;
    }
    .react-flow__controls {
      border-radius: 12px !important;
      overflow: hidden;
      border: 1px solid var(--border) !important;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06) !important;
    }
    .react-flow__minimap {
      border-radius: 12px !important;
      overflow: hidden;
      border: 1px solid var(--border) !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useState, useMemo, useCallback } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import {
      ReactFlow,
      ReactFlowProvider,
      Background,
      Controls,
      MiniMap,
      Handle,
      Position,
      MarkerType,
      useNodesState,
      useEdgesState,
      useReactFlow,
    } from 'https://esm.sh/@xyflow/react@12.6.0?deps=react@18.3.1,react-dom@18.3.1';

    const e = React.createElement;

    const TAG_LABELS = {
      auth: { label: 'Auth & Shell', cls: 'tag-auth' },
      admin: { label: 'Admin Page', cls: 'tag-admin' },
      api: { label: 'Edge API', cls: 'tag-api' },
      data: { label: 'Cloudflare', cls: 'tag-data' },
    };

    function CleanAdminNode({ data, selected }) {
      const tag = TAG_LABELS[data.layer] || TAG_LABELS.admin;
      return e(
        'div',
        { className: `wf-node ${selected ? 'selected' : ''} ${data.dimmed ? 'dimmed' : ''}` },
        e(Handle, { type: 'target', position: Position.Left }),
        e(
          'div',
          { className: 'wf-node-head' },
          e('span', { className: `wf-tag ${tag.cls}` }, tag.label),
          e('span', { style: { fontSize: '11px', color: '#94a3b8' } }, data.step || '')
        ),
        e('h3', { className: 'wf-node-title' }, data.title),
        e('p', { className: 'wf-node-desc' }, data.desc),
        e('div', { className: 'wf-node-file', title: data.file }, data.file),
        e(Handle, { type: 'source', position: Position.Right })
      );
    }

    const nodeTypes = { clean: CleanAdminNode };

    const initialNodes = [
      {
        id: 'auth-shell',
        type: 'clean',
        position: { x: 40, y: 40 },
        data: {
          layer: 'auth',
          step: 'JWT · Session',
          title: 'Admin Login & Shell',
          desc: 'ตรวจสิทธิ์ JWT cookie, แสดง Sidebar, Command Palette และสถานะ D1/R2',
          file: 'src/app/login/page.tsx · AdminShell.tsx',
        },
      },
      {
        id: 'dashboard',
        type: 'clean',
        position: { x: 40, y: 220 },
        data: {
          layer: 'admin',
          step: 'Overview',
          title: 'Dashboard ภาพรวมร้าน',
          desc: 'ยอดขาย, ออเดอร์วันนี้, กราฟ 7 วัน, Top 5 ขายดี ซิงค์อัตโนมัติทุก 5 วินาที',
          file: 'src/app/page.tsx',
        },
      },
      {
        id: 'orders-ui',
        type: 'clean',
        position: { x: 40, y: 400 },
        data: {
          layer: 'admin',
          step: 'Operations',
          title: 'จัดการคำสั่งซื้อ & สลิป',
          desc: 'กรองสถานะ, ตรวจสลิป R2, อัปเดตสถานะจัดส่ง และพิมพ์ใบเสร็จ',
          file: 'src/app/orders/page.tsx',
        },
      },
      {
        id: 'catalog-ui',
        type: 'clean',
        position: { x: 40, y: 580 },
        data: {
          layer: 'admin',
          step: 'Inventory',
          title: 'สินค้า & สต็อกคงเหลือ',
          desc: 'เพิ่ม/แก้ไขสินค้า, จัดเรียงรูปภาพ และเติมสต็อกเรียลไทม์',
          file: 'src/app/products/page.tsx · stock/page.tsx',
        },
      },
      {
        id: 'reviews-admin',
        type: 'clean',
        position: { x: 40, y: 760 },
        data: {
          layer: 'admin',
          step: 'Moderation',
          title: 'จัดการรีวิว & ตั้งค่าร้าน',
          desc: 'ซ่อน/แสดง/ลบรีวิวลูกค้า, ตั้งค่า PromptPay QR และค่าส่งเริ่มต้น',
          file: 'src/app/reviews/page.tsx · settings/page.tsx',
        },
      },
      {
        id: 'api-auth-stats',
        type: 'clean',
        position: { x: 380, y: 120 },
        data: {
          layer: 'api',
          step: 'GET / POST',
          title: '/api/admin/login & /stats',
          desc: 'ยืนยันบัญชี Admin และประมวลผลสถิติยอดขาย + รายงาน',
          file: 'src/app/api/admin/stats/route.ts',
        },
      },
      {
        id: 'api-orders-admin',
        type: 'clean',
        position: { x: 380, y: 380 },
        data: {
          layer: 'api',
          step: 'GET / PATCH',
          title: '/api/orders & /api/orders/[id]',
          desc: 'ดึงรายการสั่งซื้อทั้งหมด, เปลี่ยนสถานะ และคืน/ตัดสต็อกเมื่อยกเลิก',
          file: 'src/app/api/orders/[id]/route.ts',
        },
      },
      {
        id: 'api-catalog-reviews',
        type: 'clean',
        position: { x: 380, y: 640 },
        data: {
          layer: 'api',
          step: 'CRUD',
          title: '/api/products, /reviews & /settings',
          desc: 'จัดการสินค้า รูปภาพ รีวิว (VISIBLE/HIDDEN) และการตั้งค่าร้าน',
          file: 'src/app/api/admin/reviews/route.ts',
        },
      },
      {
        id: 'd1-bridge',
        type: 'clean',
        position: { x: 720, y: 260 },
        data: {
          layer: 'data',
          step: 'Cloudflare D1',
          title: 'Shared D1 Database (bibi-treats-db)',
          desc: 'Production ใช้ Edge DB Binding · Localhost เชื่อม Cloudflare D1 API จริงร่วมกับ Storefront',
          file: 'src/lib/d1-remote.ts · src/lib/prisma.ts',
        },
      },
      {
        id: 'r2-bucket',
        type: 'clean',
        position: { x: 720, y: 540 },
        data: {
          layer: 'data',
          step: 'Cloudflare R2',
          title: 'R2 Media Storage (bibi-treats-assets)',
          desc: 'อัปโหลดและแสดงผลรูปขนม โลโก้ร้าน QR Code สลิป และรูปรีวิว',
          file: 'src/lib/r2.ts · src/app/uploads/[...path]/route.ts',
        },
      },
    ];

    const edgeStyle = { stroke: '#94a3b8', strokeWidth: 1.6 };
    const markerEnd = { type: MarkerType.ArrowClosed, color: '#94a3b8', width: 16, height: 16 };

    const initialEdges = [
      { id: 'a1', source: 'auth-shell', target: 'api-auth-stats', type: 'smoothstep', style: edgeStyle, markerEnd, label: 'Verify JWT' },
      { id: 'a2', source: 'dashboard', target: 'api-auth-stats', type: 'smoothstep', animated: true, style: edgeStyle, markerEnd, label: '5s Poll' },
      { id: 'a3', source: 'orders-ui', target: 'api-orders-admin', type: 'smoothstep', animated: true, style: edgeStyle, markerEnd, label: '5s Poll' },
      { id: 'a4', source: 'catalog-ui', target: 'api-catalog-reviews', type: 'smoothstep', animated: true, style: edgeStyle, markerEnd, label: '5s Poll' },
      { id: 'a5', source: 'reviews-admin', target: 'api-catalog-reviews', type: 'smoothstep', animated: true, style: edgeStyle, markerEnd, label: '5s Poll' },
      { id: 'a6', source: 'api-auth-stats', target: 'd1-bridge', type: 'smoothstep', style: edgeStyle, markerEnd },
      { id: 'a7', source: 'api-orders-admin', target: 'd1-bridge', type: 'smoothstep', style: edgeStyle, markerEnd },
      { id: 'a8', source: 'api-orders-admin', target: 'r2-bucket', type: 'smoothstep', style: edgeStyle, markerEnd, label: 'View Slip' },
      { id: 'a9', source: 'api-catalog-reviews', target: 'd1-bridge', type: 'smoothstep', style: edgeStyle, markerEnd },
      { id: 'a10', source: 'api-catalog-reviews', target: 'r2-bucket', type: 'smoothstep', style: edgeStyle, markerEnd, label: 'Upload Media' },
    ];

    function WorkflowCanvas() {
      const [filter, setFilter] = useState('all');
      const [selectedNode, setSelectedNode] = useState(null);
      const [nodes, , onNodesChange] = useNodesState(initialNodes);
      const [edges, , onEdgesChange] = useEdgesState(initialEdges);
      const { fitView } = useReactFlow();

      const visibleNodes = useMemo(
        () =>
          nodes.map((n) => ({
            ...n,
            data: { ...n.data, dimmed: filter !== 'all' && n.data.layer !== filter },
          })),
        [nodes, filter]
      );

      const onNodeClick = useCallback((_, node) => {
        setSelectedNode(node);
      }, []);

      return e(
        React.Fragment,
        null,
        e(
          'div',
          { className: 'topbar' },
          e(
            'div',
            { className: 'topbar-card' },
            e('span', { className: 'brand-dot' }),
            e(
              'div',
              null,
              e('div', { className: 'title' }, "Bibi's Treats — Admin Portal Workflow"),
              e('div', { className: 'subtitle' }, 'admin-bibi-store · Port 3001 · Shared Cloudflare D1 & R2 Real-time')
            )
          ),
          e(
            'div',
            { className: 'topbar-card pill-group' },
            [
              ['all', 'All'],
              ['auth', 'Auth'],
              ['admin', 'Admin UI'],
              ['api', 'Edge API'],
              ['data', 'D1 / R2'],
            ].map(([key, label]) =>
              e(
                'button',
                {
                  key,
                  className: `pill ${filter === key ? 'active' : ''}`,
                  onClick: () => setFilter(key),
                },
                label
              )
            ),
            e(
              'button',
              {
                className: 'pill',
                onClick: () => fitView({ padding: 0.18, duration: 350 }),
              },
              'Fit View'
            )
          )
        ),
        e(
          ReactFlow,
          {
            nodes: visibleNodes,
            edges,
            nodeTypes,
            onNodesChange,
            onEdgesChange,
            onNodeClick,
            onPaneClick: () => setSelectedNode(null),
            fitView: true,
            fitViewOptions: { padding: 0.18 },
            proOptions: { hideAttribution: true },
          },
          e(Background, { gap: 22, size: 1, color: '#cbd5e1' }),
          e(Controls, { showInteractive: false }),
          e(MiniMap, {
            nodeColor: (n) =>
              n.data?.layer === 'data'
                ? '#f59e0b'
                : n.data?.layer === 'api'
                ? '#16a34a'
                : n.data?.layer === 'auth'
                ? '#9333ea'
                : '#0284c7',
            maskColor: 'rgba(248, 250, 252, 0.72)',
          })
        ),
        selectedNode &&
          e(
            'div',
            { className: 'inspector' },
            e(
              'button',
              { className: 'inspector-close', onClick: () => setSelectedNode(null) },
              '×'
            ),
            e(
              'span',
              { className: `wf-tag ${(TAG_LABELS[selectedNode.data.layer] || TAG_LABELS.admin).cls}` },
              (TAG_LABELS[selectedNode.data.layer] || TAG_LABELS.admin).label
            ),
            e('h4', null, selectedNode.data.title),
            e('p', null, selectedNode.data.desc),
            e('code', null, selectedNode.data.file)
          )
      );
    }

    createRoot(document.getElementById('root')).render(
      e(ReactFlowProvider, null, e(WorkflowCanvas))
    );
  </script>
</body>
</html>
